        .search-box { padding: 8px 12px; width: 250px; border: 1px solid #b7c7be; border-radius: 6px; font-size: 13px; background: #fff; }

        .vocab-meaning { font-size: 13.5px; color: #2d3732; margin-top: 5px; line-height: 1.4; }

        .study-option.correct { background:#dcfce7; border-color:#16a34a; }
        .study-option.wrong { background:#fee2e2; border-color:#dc2626; }

        .study-feedback { margin:12px 0; padding:10px 12px; border-radius:7px; background:#e5f1ea; line-height:1.5; }
        .match-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .match-choice { padding:10px; border:1px solid #c8dcd2; border-radius:7px; background:#fff; cursor:pointer; text-align:center; }

</head>

    const assignedFamilyNames = new Set();

        cleanedFamilyMap[parent] = [];

        const badgeText = type === 'opposite' ? '↔ 반대 개념' : (type === 'family' ? '📚 패밀리' : '🔗 연관');
        let out = `<div class="sub-item family-item"><span class="relation-badge ${badgeClass}">${badgeText}</span><div class="family-copy">`;
        out += `<div class="family-node-head" ${hasNested ? `onclick="event.stopPropagation(); toggleSubTree('${token}')"` : ''}><b>${title}</b> <span class="family-subtitle">${subtitle}</span>${hasNested ? `<span class="expand-badge" id="badge-${token}">➕ 더 보기 (${nestedFamilies.length + nestedRelations.length})</span>` : ''}</div>`;
        out += `<div>${child.desc}</div><div class="vocab-tip">💡 꿀팁: ${child.tip}</div>`;
        if (hasNested) out += `<div class="sub-tree-container nested-tree" id="tree-${token}">${renderNestedChildren(child, token, nextAncestry)}</div>`;
        out += `</div></div>`;
        return out;
    }

    function toggleSubTree(id) {
        const treeElem = document.getElementById(`tree-${id}`);
        const badgeElem = document.getElementById(`badge-${id}`);
        if (!treeElem) return;
        if (treeElem.style.display === 'block') {
            treeElem.style.display = 'none';
            if (badgeElem) { badgeElem.innerText = '➕ 더 보기'; badgeElem.style.background = '#e2ede7'; badgeElem.style.color = '#3b6e54'; }
        } else {
            treeElem.style.display = 'block';
            if (badgeElem) { badgeElem.innerText = '➖ 닫기'; badgeElem.style.background = '#3b6e54'; badgeElem.style.color = 'white'; }
        }
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        if (!query) {
            renderData();
            return;
        }

        const filtered = masterData.filter(item => 
            item.en.toLowerCase().includes(query) ||
            item.ko.toLowerCase().includes(query) ||
            item.pronounce.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query)
        );

        renderData(filtered);
    }


    // 암기 연습: 원본 단어 데이터로 객관식·주관식·빈칸·짝맞추기·플래시카드 제공
    let currentView = 'vocab';
    let currentStudyMode = 'multiple';
    let studyPool = [];
    let studyIndex = 0;
    let studyLocked = false;
    let studyScore = 0;
    let matchLeft = [];
    let matchRight = [];
    let matchSelectedLeft = null;
    let matchSelectedRight = null;
    let matchedIds = new Set();
    let flashRevealed = false;

    function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function switchMode(mode) {
        if (mode === 'study') {
            currentView = 'study';
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-ko').classList.remove('active');
            document.getElementById('btn-study').classList.add('active');
            document.getElementById('searchInput').style.display = 'none';
            document.getElementById('vocabContainer').style.display = 'none';
            document.getElementById('studyPanel').style.display = 'block';
            document.getElementById('guideTip').innerHTML = '🧠 <b>암기 연습</b>: 객관식, 주관식, 빈칸 채우기, 짝 맞추기, 플래시카드 중 원하는 방식으로 연습해 보세요.';
            startStudy(currentStudyMode);
            return;
        }
        currentView = 'vocab';
        currentMode = mode;
        document.getElementById('btn-en').classList.toggle('active', mode === 'en');
        document.getElementById('btn-ko').classList.toggle('active', mode === 'ko');
        document.getElementById('btn-study').classList.remove('active');
        document.getElementById('searchInput').style.display = '';
        document.getElementById('vocabContainer').style.display = 'flex';
        document.getElementById('studyPanel').style.display = 'none';
        const tipBox = document.getElementById('guideTip');
        tipBox.innerHTML = mode === 'en'
            ? '💡 <b>영단어 기준 모드</b>: 대표 단어 아래에 관련 개념을 모아 두었습니다. 검색하면 패밀리 속 단어도 개별 카드로 찾을 수 있어요!'
            : '💡 <b>한글 개념 기준 모드</b>: 대표 개념 아래에 관련 개념을 모아 두었습니다. 검색하면 패밀리 속 단어도 개별 카드로 찾을 수 있어요!';
        document.getElementById('searchInput').value = '';
        renderData();
    }

    function startStudy(mode) {
        currentStudyMode = mode;
        studyPool = shuffleArray(masterData).slice(0, mode === 'match' ? 5 : 10);
        studyIndex = 0;
        studyLocked = false;
        studyScore = 0;
        matchLeft = shuffleArray(studyPool);
        matchRight = shuffleArray(studyPool);
        matchSelectedLeft = null;
        matchSelectedRight = null;
        matchedIds = new Set();
        flashRevealed = false;
        document.querySelectorAll('.study-mode-btn').forEach(btn => btn.classList.remove('active'));
        const buttons = [...document.querySelectorAll('.study-mode-btn')];
        const modeIndex = ({multiple:0, short:1, blank:2, match:3, flash:4})[mode];
        if (buttons[modeIndex]) buttons[modeIndex].classList.add('active');
        renderStudy();
    }

    function renderStudy() {
        const box = document.getElementById('studyContent');
        if (!box) return;
        if (currentStudyMode === 'match') { renderMatch(box); return; }
        if (studyIndex >= studyPool.length) {
            box.innerHTML = `<div class="study-card"><div class="study-question">🎉 연습 끝!</div><p>이번 세트 점수: <b>${studyScore} / ${studyPool.length}</b></p><button class="study-action primary" onclick="startStudy(currentStudyMode)">새 문제로 다시 하기</button></div>`;
            return;
        }
        const item = studyPool[studyIndex];
        const progress = `<div class="study-muted">문제 ${studyIndex + 1} / ${studyPool.length} · 점수 ${studyScore}</div>`;
        if (currentStudyMode === 'multiple') {
            const choices = shuffleArray([item, ...shuffleArray(masterData.filter(x => x.id !== item.id)).slice(0,3)]);
            box.innerHTML = `<div class="study-card">${progress}<div class="study-question">뜻이 <span style="color:#3b6e54">“${item.ko}”</span>인 영단어는?</div><div class="study-options">${choices.map(c => `<button class="study-option" onclick="answerMultiple(${c.id},${item.id},this)">${c.en}</button>`).join('')}</div><div id="studyFeedback"></div><div style="margin-top:14px"><button class="study-action primary" id="studyNext" style="display:none" onclick="nextStudyQuestion()">다음 문제 →</button></div></div>`;
        } else if (currentStudyMode === 'short' || currentStudyMode === 'blank') {
            const prompt = currentStudyMode === 'short' ? `한글 뜻 “${item.ko}”에 해당하는 영단어를 써 보세요.` : `아래 설명의 빈칸에 들어갈 영단어를 쓰세요.`;
            box.innerHTML = `<div class="study-card">${progress}<div class="study-question">${prompt}</div>${currentStudyMode === 'blank' ? `<p>${item.desc}</p>` : `<p class="study-muted">힌트: ${item.desc}</p>`}<label for="studyAnswer">영단어</label><br><input class="study-input" id="studyAnswer" autocomplete="off" placeholder="영단어 입력..." onkeydown="if(event.key==='Enter') checkTypedAnswer()"><br><button class="study-action primary" onclick="checkTypedAnswer()">정답 확인</button><div id="studyFeedback"></div><div style="margin-top:14px"><button class="study-action primary" id="studyNext" style="display:none" onclick="nextStudyQuestion()">다음 문제 →</button></div></div>`;
            setTimeout(() => document.getElementById('studyAnswer')?.focus(), 0);
        } else if (currentStudyMode === 'flash') {
            box.innerHTML = `<div class="study-card">${progress}<div class="flash-front">${item.en}</div>${flashRevealed ? `<div class="study-question">${item.ko}</div><p>${item.desc}</p><div class="study-feedback">💡 꿀팁: ${item.tip}</div>` : `<p class="study-muted" style="text-align:center">뜻을 떠올린 다음 정답을 확인하세요.</p>`}<div style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${!flashRevealed ? `<button class="study-action primary" onclick="revealFlashcard()">뜻과 꿀팁 보기</button>` : `<button class="study-action" onclick="markFlashcard(false)">아직 헷갈려요</button><button class="study-action primary" onclick="markFlashcard(true)">외웠어요 ✓</button>`}</div></div>`;
        }
    }

    function answerMultiple(chosenId, correctId, button) {
        if (studyLocked) return;
        studyLocked = true;
        const buttons = [...document.querySelectorAll('.study-option')];
        buttons.forEach(b => { b.disabled = true; });
        if (chosenId === correctId) { studyScore++; button.classList.add('correct'); }
        else {
            button.classList.add('wrong');
            const correct = itemByName.get(studyPool[studyIndex].en);
            buttons.find(b => b.textContent === correct.en)?.classList.add('correct');
        }
        const item = studyPool[studyIndex];
        document.getElementById('studyFeedback').innerHTML = `<div class="study-feedback">${chosenId === correctId ? '정답! 🎉' : '아쉽지만 오답이에요.'}<br><b>${item.en}</b> — ${item.desc}<br>💡 ${item.tip}</div>`;
        document.getElementById('studyNext').style.display = 'inline-block';
    }

    function normalizeAnswer(value) { return value.toLowerCase().trim().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' '); }
    function checkTypedAnswer() {
        if (studyLocked) return;
        const item = studyPool[studyIndex];
        const answer = normalizeAnswer(document.getElementById('studyAnswer').value);
        const correct = normalizeAnswer(item.en);
        studyLocked = true;
        const ok = answer === correct;
        if (ok) studyScore++;
        document.getElementById('studyFeedback').innerHTML = `<div class="study-feedback">${ok ? '정답! 🎉' : '정답은'} <b>${item.en}</b> (${item.ko})<br>${item.desc}<br>💡 꿀팁: ${item.tip}</div>`;
        document.getElementById('studyNext').style.display = 'inline-block';
        document.getElementById('studyAnswer').disabled = true;
    }

    function nextStudyQuestion() { studyIndex++; studyLocked = false; flashRevealed = false; renderStudy(); }
    function revealFlashcard() { flashRevealed = true; renderStudy(); }
    function markFlashcard(remembered) { if (remembered) studyScore++; nextStudyQuestion(); }

    function renderMatch(box) {
        const done = matchedIds.size;
        if (done === studyPool.length) {
            box.innerHTML = `<div class="study-card"><div class="study-question">🎉 모든 짝을 맞췄어요!</div><p>총 ${studyPool.length}쌍을 완성했어요.</p><button class="study-action primary" onclick="startStudy('match')">새로운 짝 맞추기</button></div>`;
            return;
        }
        box.innerHTML = `<div class="study-card"><div class="study-muted">영단어와 한글 뜻을 눌러 짝을 맞추세요 · ${done}/${studyPool.length}쌍</div><div class="match-grid"><div>${matchLeft.map(item => `<button class="match-choice ${matchedIds.has(item.id)?'matched':''} ${matchSelectedLeft===item.id?'selected':''}" ${matchedIds.has(item.id)?'disabled':''} onclick="selectMatch('left',${item.id})">${item.en}</button>`).join('')}</div><div>${matchRight.map(item => `<button class="match-choice ${matchedIds.has(item.id)?'matched':''} ${matchSelectedRight===item.id?'selected':''}" ${matchedIds.has(item.id)?'disabled':''} onclick="selectMatch('right',${item.id})">${item.ko}</button>`).join('')}</div></div><div id="matchFeedback" class="study-feedback">왼쪽 영단어 하나, 오른쪽 뜻 하나를 선택하세요.</div><button class="study-action" onclick="startStudy('match')">다시 섞기</button></div>`;
    }

    function selectMatch(side, id) {
        if (side === 'left') matchSelectedLeft = id; else matchSelectedRight = id;
        if (matchSelectedLeft !== null && matchSelectedRight !== null) {
            const left = itemByName.get(studyPool.find(x => x.id === matchSelectedLeft)?.en);
            const right = studyPool.find(x => x.id === matchSelectedRight);
            if (left && right && left.id === right.id) {
                matchedIds.add(left.id); studyScore++;
                matchSelectedLeft = null; matchSelectedRight = null;
                renderMatch(document.getElementById('studyContent'));
                const feedback = document.getElementById('matchFeedback');
                if (feedback) feedback.textContent = '맞았어요! 다음 짝을 찾아보세요.';
                if (matchedIds.size === studyPool.length) renderMatch(document.getElementById('studyContent'));
                return;
            }
            renderMatch(document.getElementById('studyContent'));
            const feedback = document.getElementById('matchFeedback');
            if (feedback) feedback.textContent = '짝이 아니에요. 단어의 뜻을 다시 생각해 보세요.';
            matchSelectedLeft = null; matchSelectedRight = null;
            return;
        }
        renderMatch(document.getElementById('studyContent'));
    }


    // 초기 실행
    renderData();
</script>

</body>
</html>
